name: CD - Publish to NPM

# Releases are driven by tags, not by pushes to main.
#
# The flow is: bump the version in a release PR (with its CHANGELOG entry)
# -> merge -> push the tag. Pushing the tag is the act that publishes.
# This keeps releases intentional and keeps the published version, the tag
# and the GitHub Release in agreement.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify without publishing'
        required: false
        type: boolean
        default: true

env:
  NODE_VERSION: '20'
  REGISTRY_URL: 'https://registry.npmjs.org'
  PACKAGE_NAME: '@nestjslatam/ddd-lib'
  LIB_MANIFEST: 'libs/ddd/package.json'
  DIST_DIR: 'dist/libs/ddd'
  TAG_PREFIX: 'v'

jobs:
  publish:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    # A single job on purpose: the version, the build and the publish must
    # all come from the same checkout, or they drift apart.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@nestjslatam/ddd-lib
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ env.REGISTRY_URL }}

      - name: Resolve version
        id: version
        run: |
          VERSION=$(node -p "require('./$LIB_MANIFEST').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $VERSION"

      - name: Verify the tag matches the manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/$TAG_PREFIX}"
          MANIFEST="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag $GITHUB_REF does not match $LIB_MANIFEST version $MANIFEST."
            exit 1
          fi
          echo "Tag and manifest agree on $MANIFEST."

      - name: Check whether this version is already published
        id: published
        run: |
          if npm view "$PACKAGE_NAME@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::warning::$PACKAGE_NAME@${{ steps.version.outputs.version }} is already on npm. Skipping publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          npm test
          npm run test:e2e

      - name: Build library
        run: npm run build:lib

      - name: Verify the tarball installs and imports
        # The check that matters. Publishing a package that builds but does
        # not install is exactly how undeclared peer dependencies reached
        # consumers of this and its sibling packages.
        run: |
          PACK_DIR="$(mktemp -d)"
          (cd "$DIST_DIR" && npm pack --pack-destination "$PACK_DIR")
          TARBALL="$(find "$PACK_DIR" -name '*.tgz' | head -1)"

          SMOKE_DIR="$(mktemp -d)"
          cd "$SMOKE_DIR"
          npm init -y >/dev/null
          # Nothing is installed by hand: whatever the package needs, it
          # must declare, so that npm resolves it here.
          npm install "$TARBALL"
          # --no-experimental-require-module emulates a strict CommonJS
          # consumer -- Jest's runtime, and Node before 20.19. Without it,
          # newer Node transparently loads ESM through require() and an
          # ESM-only dependency slips through: that is how uuid@14 reached
          # ddd-lib@2.1.0 and broke every Jest-based consumer.
          PACKAGE_NAME="$PACKAGE_NAME" node --no-experimental-require-module -e "
            try { require('reflect-metadata'); } catch (e) { /* not every package needs it */ }
            const name = process.env.PACKAGE_NAME;
            const m = require(name);
            const n = Object.keys(m).length;
            if (n === 0) throw new Error(name + ' exports nothing');
            const fs = require('fs');
            if (!fs.existsSync('node_modules/' + name + '/index.d.ts'))
              throw new Error(name + ' ships no type declarations');
            console.log('Imported ' + n + ' exports from ' + name + ', declarations present.');
          "

      - name: Publish to NPM
        if: steps.published.outputs.already == 'false' && inputs.dry_run != true
        # NPM_TOKEN must be an Automation token. Classic tokens that bypass
        # 2FA are being restricted by npm and fail with a misleading
        # "404 Not Found - PUT", which is npm's generic auth error for
        # scoped packages.
        run: cd "$DIST_DIR" && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Published as [`@nestjslatam/ddd-lib@${{ steps.version.outputs.version }}`](https://www.npmjs.com/package/@nestjslatam/ddd-lib/v/${{ steps.version.outputs.version }}).

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
